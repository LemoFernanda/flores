<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramo Especial para Lara y Nicki</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1c29;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #loading {
            position: absolute;
            font-size: 1.2rem;
            color: #ffe082;
            text-align: center;
        }

        #canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="loading">✨ Cargando las flores... unos segundos ✨</div>
    <div id="canvas-container"></div>

    <script>
        async function main() {
            let pyodide = await loadPyodide();
            
            // Ocultamos el mensaje de carga cuando Pyodide está listo
            document.getElementById("loading").style.display = "none";

            // Código de Python exacto con animación de Turtle
            const pythonCode = `
import turtle
import math

screen = turtle.Screen()
screen.setup(width=800, height=700)
screen.bgcolor('#1a1c29')
screen.title("Ramo Especial para Iara y Nicki")

t = turtle.Turtle()
t.speed(0)
t.hideturtle()

# Titulo
t.penup()
t.goto(0, 260)
t.color('white')
t.write("Ramo Especial para Iara y Nicki", align="center", font=("Georgia", 22, "bold"))

# Tallo central base
def draw_stems():
    t.pensize(3)
    t.color('#388e3c')
    
    # Lazos e interseccion inferior
    t.penup()
    t.goto(0, -200)
    t.pendown()
    t.goto(-40, -280)
    t.penup()
    t.goto(0, -200)
    t.pendown()
    t.goto(40, -280)

    # Tallos que se abren en abanico
    targets = [
        (-220, 100), (-160, 160), (-100, 40), (-50, 180),
        (0, 60), (50, 180), (100, 40), (160, 160), (220, 100)
    ]
    
    for tx, ty in targets:
        t.penup()
        t.goto(0, -200)
        t.pendown()
        t.goto(tx, ty)

# Espigas tipo lavanda
def draw_lavender(x_start, y_start, direction):
    t.pensize(4)
    t.color('#ce93d8')
    t.penup()
    t.goto(x_start, y_start)
    t.pendown()
    
    curr_x, curr_y = x_start, y_start
    for i in range(25):
        curr_x += direction * 3 + math.sin(i * 0.5) * 4
        curr_y += 12
        t.goto(curr_x, curr_y)
        t.dot(8, '#e1bee7')

# Flor amarilla dentada
def draw_yellow_flower(x, y, radius):
    t.penup()
    t.goto(x, y - radius)
    t.setheading(0)
    t.color('#fff59d', '#ffee58')
    t.begin_fill()
    
    petals = 20
    for i in range(petals):
        t.circle(radius, 360 / petals)
        t.left(90)
        t.forward(8)
        t.backward(8)
        t.right(90)
    t.end_fill()
    
    # Centro
    t.penup()
    t.goto(x, y - radius * 0.4)
    t.color('#fff176')
    t.begin_fill()
    t.circle(radius * 0.4)
    t.end_fill()

# Flor blanca pequeña
def draw_white_flower(x, y):
    t.penup()
    t.goto(x, y)
    t.color('#ffffff')
    for _ in range(8):
        t.pendown()
        t.forward(15)
        t.dot(6, '#ffffff')
        t.backward(15)
        t.right(45)
    t.dot(10, '#ffee58')

# Flor rosada/violeta
def draw_pink_flower(x, y):
    t.penup()
    t.goto(x, y)
    t.color('#f48fb1')
    for _ in range(3):
        t.pendown()
        t.forward(18)
        t.dot(10, '#f48fb1')
        t.backward(18)
        t.right(30)

# Dibujar Ramo
draw_stems()
draw_lavender(0, -200, -2.5)
draw_lavender(0, -200, 2.5)

# Flores secundarias
draw_pink_flower(-160, 160)
draw_pink_flower(160, 160)
draw_pink_flower(-100, 40)
draw_pink_flower(100, 40)

draw_white_flower(0, 180)
draw_white_flower(-220, 100)
draw_white_flower(220, 100)

# Flores amarillas principales
draw_yellow_flower(-100, 70, 45)
draw_yellow_flower(100, 70, 45)
draw_yellow_flower(0, 30, 50)

# Moño base
t.penup()
t.goto(0, -200)
t.dot(30, '#a5d6a7')
`;

            await pyodide.runPythonAsync(pythonCode);
        }
        main();
    </script>
</body>
</html>
