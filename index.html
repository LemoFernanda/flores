<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramo Especial para Iara y Nicki</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1c29;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="flowerCanvas" width="800" height="700"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        // Función para transformar coordenadas tipo Turtle a Canvas
        function toCanvas(x, y) {
            return [400 + x, 350 - y];
        }

        // Fondo
        ctx.fillStyle = '#1a1c29';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Título
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px Georgia';
        ctx.textAlign = 'center';
        ctx.fillText('Ramo Especial para Iara y Nicki', 400, 50);

        // Tallos base y abanico
        ctx.strokeStyle = '#388e3c';
        ctx.lineWidth = 3;

        const [x0, y0] = toCanvas(0, -200);
        const [x1, y1] = toCanvas(-40, -280);
        const [x2, y2] = toCanvas(40, -280);

        ctx.beginPath();
        ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
        ctx.moveTo(x0, y0); ctx.lineTo(x2, y2);
        ctx.stroke();

        const targets = [
            [-220, 100], [-160, 160], [-100, 40], [-50, 180],
            [0, 60], [50, 180], [100, 40], [160, 160], [220, 100]
        ];

        targets.forEach(([tx, ty]) => {
            const [cx, cy] = toCanvas(tx, ty);
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(cx, cy);
            ctx.stroke();
        });

        // Espigas tipo lavanda
        function drawLavender(xStart, yStart, direction) {
            let currX = xStart;
            let currY = yStart;
            for (let i = 0; i < 25; i++) {
                currX += direction * 3 + Math.sin(i * 0.5) * 4;
                currY += 12;
                const [cx, cy] = toCanvas(currX, currY);
                ctx.fillStyle = '#e1bee7';
                ctx.beginPath();
                ctx.arc(cx, cy, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        drawLavender(0, -200, -2.5);
        drawLavender(0, -200, 2.5);

        // Flor rosada
        function drawPinkFlower(x, y) {
            const [cx, cy] = toCanvas(x, y);
            ctx.strokeStyle = '#f48fb1';
            ctx.lineWidth = 2;
            [0, 120, 240].forEach(angle => {
                const rad = angle * Math.PI / 180;
                const px = cx + Math.cos(rad) * 18;
                const py = cy + Math.sin(rad) * 18;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(px, py);
                ctx.stroke();
                ctx.fillStyle = '#f48fb1';
                ctx.beginPath();
                ctx.arc(px, py, 5, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Flor blanca
        function drawWhiteFlower(x, y) {
            const [cx, cy] = toCanvas(x, y);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 8; i++) {
                const rad = (i * 45) * Math.PI / 180;
                const px = cx + Math.cos(rad) * 15;
                const py = cy + Math.sin(rad) * 15;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(px, py);
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(px, py, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = '#ffee58';
            ctx.beginPath();
            ctx.arc(cx, cy, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        // Flor amarilla dentada
        function drawYellowFlower(x, y, radius) {
            const [cx, cy] = toCanvas(x, y);
            const petals = 20;
            ctx.fillStyle = '#ffee58';
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#fff59d';
            ctx.lineWidth = 2;
            for (let i = 0; i < petals; i++) {
                const rad = (i * (360 / petals)) * Math.PI / 180;
                const px1 = cx + Math.cos(rad) * radius;
                const py1 = cy + Math.sin(rad) * radius;
                const px2 = cx + Math.cos(rad) * (radius + 6);
                const py2 = cy + Math.sin(rad) * (radius + 6);
                ctx.beginPath();
                ctx.moveTo(px1, py1);
                ctx.lineTo(px2, py2);
                ctx.stroke();
            }

            ctx.fillStyle = '#fff176';
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }

        // Dibujar flores
        drawPinkFlower(-160, 160);
        drawPinkFlower(160, 160);
        drawPinkFlower(-100, 40);
        drawPinkFlower(100, 40);

        drawWhiteFlower(0, 180);
        drawWhiteFlower(-220, 100);
        drawWhiteFlower(220, 100);

        drawYellowFlower(-100, 70, 45);
        drawYellowFlower(100, 70, 45);
        drawYellowFlower(0, 30, 50);

        // Moño base
        ctx.fillStyle = '#a5d6a7';
        ctx.beginPath();
        ctx.arc(x0, y0, 15, 0, Math.PI * 2);
        ctx.fill();
    </script>
</body>
</html>
