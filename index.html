<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            text-align: center;
            position: relative;
        }

        h1 {
            color: #f4d03f;
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(244, 208, 63, 0.5);
            animation: fadeIn 2s ease-in-out;
        }

        canvas {
            background-color: transparent;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            border-radius: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ Para ustedes ✨</h1>
        <canvas id="flowerCanvas" width="600" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        // Dibujar Tallo
        function drawStem(startX, startY, endX, endY) {
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo((startX + endX)/2 + 20, (startY + endY)/2, endX, endY);
            ctx.strokeStyle = '#2d5a27';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        // Dibujar Hojas
        function drawLeaf(x, y, angle, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.ellipse(0, 0, size, size / 2, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#3a7d34';
            ctx.fill();
            ctx.strokeStyle = '#1e461a';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }

        // Dibujar Flor Amarilla
        function drawFlower(centerX, centerY, petals, petalRadius, centerRadius) {
            // Pétalos
            for (let i = 0; i < petals; i++) {
                const angle = (i * 2 * Math.PI) / petals;
                const x = centerX + Math.cos(angle) * (petalRadius * 0.7);
                const y = centerY + Math.sin(angle) * (petalRadius * 0.7);

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.ellipse(0, 0, petalRadius, petalRadius / 2.2, 0, 0, Math.PI * 2);
                
                // Degradado amarillo brillante
                let grad = ctx.createRadialGradient(0, 0, 2, 0, 0, petalRadius);
                grad.addColorStop(0, '#fff176');
                grad.addColorStop(0.7, '#fbc02d');
                grad.addColorStop(1, '#f57f17');
                
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.restore();
            }

            // Centro de la flor
            ctx.beginPath();
            ctx.arc(centerX, centerY, centerRadius, 0, Math.PI * 2);
            let centerGrad = ctx.createRadialGradient(centerX, centerY, 2, centerX, centerY, centerRadius);
            centerGrad.addColorStop(0, '#a1887f');
            centerGrad.addColorStop(0.8, '#5d4037');
            centerGrad.addColorStop(1, '#3e2723');
            ctx.fillStyle = centerGrad;
            ctx.fill();
            ctx.strokeStyle = '#270f08';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Ramo Completo
        function drawBouquet() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Tallos
            drawStem(300, 580, 200, 300);
            drawStem(300, 580, 400, 320);
            drawStem(300, 580, 300, 240);
            drawStem(300, 580, 150, 220);
            drawStem(300, 580, 450, 230);

            // Hojas
            drawLeaf(260, 480, -0.5, 35);
            drawLeaf(340, 490, 0.5, 35);
            drawLeaf(220, 380, -0.8, 40);
            drawLeaf(380, 390, 0.8, 40);

            // Flores
            drawFlower(150, 220, 14, 38, 16);
            drawFlower(450, 230, 14, 38, 16);
            drawFlower(200, 300, 15, 42, 18);
            drawFlower(400, 320, 15, 42, 18);
            drawFlower(300, 240, 16, 48, 20); // Flor central principal
        }

        drawBouquet();
    </script>
</body>
</html>
