<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramo Especial para Iara y Nicki</title>
    <!-- Carga de Brython y la librería Turtle -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/brython/3.11.0/brython.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/brython/3.11.0/brython_stdlib.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1c29;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #turtle-div {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body onload="brython()">

    <div id="turtle-div"></div>

    <script type="text/python">
import turtle
import math

# Configurar pantalla de Turtle limpia
screen = turtle.Screen()
screen.bgcolor("#1a1c29")

# Crear la tortuguita
t = turtle.Turtle()
t.speed(3)

# Titulo
t.penup()
t.goto(0, 250)
t.color("white")
t.write("Ramo Especial para Iara y Nicki", align="center", font=("Georgia", 20, "bold"))

# Tallos
targets = [
    (-220, 100), (-160, 160), (-100, 40), (-50, 180),
    (0, 60), (50, 180), (100, 40), (160, 160), (220, 100)
]

t.color("#388e3c")
t.pensize(3)

# Lazos base
t.penup()
t.goto(0, -200)
t.pendown()
t.goto(-40, -280)

t.penup()
t.goto(0, -200)
t.pendown()
t.goto(40, -280)

for tx, ty in targets:
    t.penup()
    t.goto(0, -200)
    t.pendown()
    t.goto(tx, ty)

# Espigas tipo lavanda
def draw_lavender(x_start, y_start, direction):
    t.penup()
    t.goto(x_start, y_start)
    curr_x, curr_y = x_start, y_start
    t.color("#e1bee7")
    for i in range(25):
        curr_x += direction * 3 + math.sin(i * 0.5) * 4
        curr_y += 12
        t.penup()
        t.goto(curr_x, curr_y)
        t.pendown()
        t.dot(8)

draw_lavender(0, -200, -2.5)
draw_lavender(0, -200, 2.5)

# Flor rosada
def draw_pink_flower(x, y):
    t.penup()
    t.goto(x, y)
    t.color("#f48fb1")
    t.pensize(2)
    for angle in [0, 120, 240]:
        rad = math.radians(angle)
        px = x + math.cos(rad) * 18
        py = y + math.sin(rad) * 18
        t.penup()
        t.goto(x, y)
        t.pendown()
        t.goto(px, py)
        t.dot(10)

# Flor blanca
def draw_white_flower(x, y):
    t.penup()
    t.goto(x, y)
    t.color("#ffffff")
    t.pensize(1.5)
    for i in range(8):
        rad = math.radians(i * 45)
        px = x + math.cos(rad) * 15
        py = y + math.sin(rad) * 15
        t.penup()
        t.goto(x, y)
        t.pendown()
        t.goto(px, py)
        t.dot(6)
    t.penup()
    t.goto(x, y)
    t.color("#ffee58")
    t.dot(10)

# Flor amarilla dentada
def draw_yellow_flower(x, y, radius):
    t.penup()
    t.goto(x, y)
    t.color("#ffee58")
    t.dot(radius * 2)
    
    petals = 20
    t.color("#fff59d")
    t.pensize(2)
    for i in range(petals):
        rad = math.radians(i * (360 / petals))
        px1 = x + math.cos(rad) * radius
        py1 = y + math.sin(rad) * radius
        px2 = x + math.cos(rad) * (radius + 6)
        py2 = y + math.sin(rad) * (radius + 6)
        t.penup()
        t.goto(px1, py1)
        t.pendown()
        t.goto(px2, py2)

    t.penup()
    t.goto(x, y)
    t.color("#fff176")
    t.dot(radius * 0.8)

# Dibujar flores
draw_pink_flower(-160, 160)
draw_pink_flower(160, 160)
draw_pink_flower(-100, 40)
draw_pink_flower(100, 40)

draw_white_flower(0, 180)
draw_white_flower(-220, 100)
draw_white_flower(220, 100)

draw_yellow_flower(-100, 70, 45)
draw_yellow_flower(100, 70, 45)
draw_yellow_flower(0, 30, 50)

# Moño
t.penup()
t.goto(0, -200)
t.color("#a5d6a7")
t.dot(30)

t.hideturtle()
    </script>
</body>
</html>
