
       <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramo Especial para Iara y Nicki</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1c29;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="flowerCanvas" width="800" height="700"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        function toCanvas(x, y) {
            return [400 + x, 350 - y];
        }

        // Fondo
        ctx.fillStyle = '#1a1c29';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Título
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px Georgia';
        ctx.textAlign = 'center';
        ctx.fillText('Ramo Especial para Iara y Nicki', 400, 50);

        // Función para pausar la ejecución y dar el efecto de dibujo lento
        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function drawLineAnimated(x1, y1, x2, y2, color, width, steps = 20) {
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            const [p1x, p1y] = toCanvas(x1, y1);
            const [p2x, p2y] = toCanvas(x2, y2);

            let lastX = p1x;
            let lastY = p1y;

            for (let i = 1; i <= steps; i++) {
                const currentX = p1x + (p2x - p1x) * (i / steps);
                const currentY = p1y + (p2y - p1y) * (i / steps);

                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(currentX, currentY);
                ctx.stroke();

                lastX = currentX;
                lastY = currentY;

                await delay(20); // Pausa entre cada tramito de la línea
            }
        }

        async function drawCircleAnimated(x, y, radius, color) {
            const [cx, cy] = toCanvas(x, y);
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fill();
            await delay(30);
        }

        async function startPenDrawing() {
            // 1. Tallos
            await drawLineAnimated(0, -200, -40, -280, '#388e3c', 3);
            await drawLineAnimated(0, -200, 40, -280, '#388e3c', 3);

            const targets = [
                [-220, 100], [-160, 160], [-100, 40], [-50, 180],
                [0, 60], [50, 180], [100, 40], [160, 160], [220, 100]
            ];

            for (let t of targets) {
                await drawLineAnimated(0, -200, t[0], t[1], '#388e3c', 3);
            }

            // 2. Lavandas
            async function drawLavender(xStart, yStart, direction) {
                let currX = xStart;
                let currY = yStart;
                for (let i = 0; i < 25; i++) {
                    currX += direction * 3 + Math.sin(i * 0.5) * 4;
                    currY += 12;
                    await drawCircleAnimated(currX, currY, 4, '#e1bee7');
                }
            }

            await drawLavender(0, -200, -2.5);
            await drawLavender(0, -200, 2.5);

            // 3. Flores Rosadas
            async function drawPinkFlower(x, y) {
                for (let angle of [0, 120, 240]) {
                    const rad = angle * Math.PI / 180;
                    const px = x + Math.cos(rad) * 18;
                    const py = y + Math.sin(rad) * 18;
                    await drawLineAnimated(x, y, px, py, '#f48fb1', 2, 10);
                    await drawCircleAnimated(px, py, 5, '#f48fb1');
                }
            }

            await drawPinkFlower(-160, 160);
            await drawPinkFlower(160, 160);
            await drawPinkFlower(-100, 40);
            await drawPinkFlower(100, 40);

            // 4. Flores Blancas
            async function drawWhiteFlower(x, y) {
                for (let i = 0; i < 8; i++) {
                    const rad = (i * 45) * Math.PI / 180;
                    const px = x + Math.cos(rad) * 15;
                    const py = y + Math.sin(rad) * 15;
                    await drawLineAnimated(x, y, px, py, '#ffffff', 1.5, 8);
                    await drawCircleAnimated(px, py, 3, '#ffffff');
                }
                await drawCircleAnimated(x, y, 5, '#ffee58');
            }

            await drawWhiteFlower(0, 180);
            await drawWhiteFlower(-220, 100);
            await drawWhiteFlower(220, 100);

            // 5. Flores Amarillas
            async function drawYellowFlower(x, y, radius) {
                const petals = 20;
                await drawCircleAnimated(x, y, radius, '#ffee58');

                for (let i = 0; i < petals; i++) {
                    const rad = (i * (360 / petals)) * Math.PI / 180;
                    const px1 = x + Math.cos(rad) * radius;
                    const py1 = y + Math.sin(rad) * radius;
                    const px2 = x + Math.cos(rad) * (radius + 6);
                    const py2 = y + Math.sin(rad) * (radius + 6);
                    await drawLineAnimated(px1, py1, px2, py2, '#fff59d', 2, 5);
                }

                await drawCircleAnimated(x, y, radius * 0.4, '#fff176');
            }

            await drawYellowFlower(-100, 70, 45);
            await drawYellowFlower(100, 70, 45);
            await drawYellowFlower(0, 30, 50);

            // Moño
            await drawCircleAnimated(0, -200, 15, '#a5d6a7');
        }

        startPenDrawing();
    </script>
</body>
</html>
