<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramo Especial para Iara y Nicki</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1c29;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="flowerCanvas" width="800" height="700"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        function toCanvas(x, y) {
            return [400 + x, 350 - y];
        }

        let angle = 0;

        function drawLavender(xStart, yStart, direction, wave) {
            let currX = xStart;
            let currY = yStart;
            for (let i = 0; i < 25; i++) {
                currX += direction * 3 + Math.sin(i * 0.5 + wave) * 4;
                currY += 12;
                const [cx, cy] = toCanvas(currX, currY);
                ctx.fillStyle = '#e1bee7';
                ctx.beginPath();
                ctx.arc(cx, cy, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawPinkFlower(x, y, offset) {
            const moveX = Math.sin(angle + offset) * 5;
            const [cx, cy] = toCanvas(x + moveX, y);
            ctx.strokeStyle = '#f48fb1';
            ctx.lineWidth = 2;
            [0, 120, 240].forEach(a => {
                const rad = a * Math.PI / 180;
                const px = cx + Math.cos(rad) * 18;
                const py = cy + Math.sin(rad) * 18;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(px, py);
                ctx.stroke();
                ctx.fillStyle = '#f48fb1';
                ctx.beginPath();
                ctx.arc(px, py, 5, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawWhiteFlower(x, y, offset) {
            const moveX = Math.sin(angle + offset) * 4;
            const [cx, cy] = toCanvas(x + moveX, y);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 8; i++) {
                const rad = (i * 45) * Math.PI / 180;
                const px = cx + Math.cos(rad) * 15;
                const py = cy + Math.sin(rad) * 15;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(px, py);
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(px, py, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = '#ffee58';
            ctx.beginPath();
            ctx.arc(cx, cy, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawYellowFlower(x, y, radius, offset) {
            const moveX = Math.sin(angle + offset) * 8;
            const moveY = Math.cos(angle + offset) * 3;
            const [cx, cy] = toCanvas(x + moveX, y + moveY);
            const petals = 20;

            ctx.fillStyle = '#ffee58';
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#fff59d';
            ctx.lineWidth = 2;
            for (let i = 0; i < petals; i++) {
                const rad = (i * (360 / petals)) * Math.PI / 180;
                const px1 = cx + Math.cos(rad) * radius;
                const py1 = cy + Math.sin(rad) * radius;
                const px2 = cx + Math.cos(rad) * (radius + 6);
                const py2 = cy + Math.sin(rad) * (radius + 6);
                ctx.beginPath();
                ctx.moveTo(px1, py1);
                ctx.lineTo(px2, py2);
                ctx.stroke();
            }

            ctx.fillStyle = '#fff176';
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate() {
            ctx.fillStyle = '#1a1c29';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Título
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px Georgia';
            ctx.textAlign = 'center';
            ctx.fillText('Ramo Especial para Iara y Nicki', 400, 50);

            // Tallos
            ctx.strokeStyle = '#388e3c';
            ctx.lineWidth = 3;

            const [x0, y0] = toCanvas(0, -200);
            const [x1, y1] = toCanvas(-40, -280);
            const [x2, y2] = toCanvas(40, -280);

            ctx.beginPath();
            ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
            ctx.moveTo(x0, y0); ctx.lineTo(x2, y2);
            ctx.stroke();

            const targets = [
                [-220, 100], [-160, 160], [-100, 40], [-50, 180],
                [0, 60], [50, 180], [100, 40], [160, 160], [220, 100]
            ];

            targets.forEach(([tx, ty], idx) => {
                const moveX = Math.sin(angle + idx) * 5;
                const [cx, cy] = toCanvas(tx + moveX, ty);
                ctx.beginPath();
                ctx.moveTo(x0, y0);
                ctx.lineTo(cx, cy);
                ctx.stroke();
            });

            // Lavandas
            drawLavender(0, -200, -2.5, angle);
            drawLavender(0, -200, 2.5, -angle);

            // Flores secundarias
            drawPinkFlower(-160, 160, 0);
            drawPinkFlower(160, 160, 1);
            drawPinkFlower(-100, 40, 2);
            drawPinkFlower(100, 40, 3);

            drawWhiteFlower(0, 180, 0.5);
            drawWhiteFlower(-220, 100, 1.5);
            drawWhiteFlower(220, 100, 2.5);

            // Flores amarillas
            drawYellowFlower(-100, 70, 45, 0);
            drawYellowFlower(100, 70, 45, 1.5);
            drawYellowFlower(0, 30, 50, 0.8);

            // Moño
            ctx.fillStyle = '#a5d6a7';
            ctx.beginPath();
            ctx.arc(x0, y0, 15, 0, Math.PI * 2);
            ctx.fill();

            angle += 0.04;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
